[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avsb"
version = "0.1.0"
description = "av-safety-benchmark: system-agnostic AV safety benchmark (scenarios, kinematic sim, surrogate metrics, standards-aligned report)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "BRKMYR" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "PyYAML>=6.0.1,<7",
    "Jinja2>=3.1.3,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
avsb = "avsb.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avsb = [
    "regmap/regulatory_mapping.yaml",
    "report/templates/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
